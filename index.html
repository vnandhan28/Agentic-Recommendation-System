<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopBot — Agentic Recommendations</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:       #1d4ed8;
      --brand-light: #eff6ff;
      --brand-dark:  #1e3a8a;
      --accent:      #f59e0b;
      --surface:     #ffffff;
      --bg:          #f8fafc;
      --border:      #e2e8f0;
      --text:        #0f172a;
      --muted:       #64748b;
      --radius:      10px;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md:   0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: var(--shadow-sm);
    }
    .nav-left { display: flex; align-items: center; gap: 10px; }
    .nav-logo {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--brand);
      letter-spacing: -0.4px;
    }
    .nav-tagline {
      font-size: .75rem;
      color: var(--muted);
      border-left: 1px solid var(--border);
      padding-left: 10px;
    }
    .nav-right { display: flex; align-items: center; gap: 8px; }
    .login-label { font-size: .78rem; color: var(--muted); }
    .btn-user {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: .78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-user:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
    .btn-user.active {
      background: var(--brand);
      color: #fff;
      border-color: var(--brand);
      font-weight: 600;
    }
    .logged-in-badge {
      font-size: .75rem;
      color: #16a34a;
      font-weight: 600;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 20px;
      padding: 3px 10px;
    }

    /* ── Layout ── */
    .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 100px; }

    /* ── Login gate ── */
    #login-gate {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: .83rem;
      color: #92400e;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #login-gate.hidden { display: none; }
    #clicks-counter {
      font-size: .75rem;
      color: var(--muted);
      margin-bottom: 20px;
    }

    /* ── Category section ── */
    .category-section { margin-bottom: 40px; }
    .category-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--border);
    }
    .category-icon {
      width: 40px; height: 40px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .category-icon img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .category-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .category-count {
      font-size: .72rem;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
    }

    /* ── Product row (horizontal scroll) ── */
    .product-row {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    /* ── Product card ── */
    .product-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 16px;
      cursor: pointer;
      transition: box-shadow .18s, border-color .18s, transform .12s;
      position: relative;
      user-select: none;
    }
    .product-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #bfdbfe;
      transform: translateY(-2px);
    }
    .product-card.clicked {
      border-color: var(--brand);
      background: var(--brand-light);
    }
    .product-card.clicked::after {
      content: "✓";
      position: absolute;
      top: 10px; right: 12px;
      color: var(--brand);
      font-weight: 700;
      font-size: .8rem;
    }
    .card-thumb {
      width: 100%;
      height: 110px;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 12px;
      background: var(--bg);
    }
    .card-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .3s;
    }
    .product-card:hover .card-thumb img { transform: scale(1.04); }
    .card-title {
      font-size: .82rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 10px;
      min-height: 2.4em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: var(--text);
    }
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-price {
      font-size: .9rem;
      font-weight: 700;
      color: var(--brand);
    }
    .card-rating {
      font-size: .73rem;
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .card-brand {
      font-size: .68rem;
      color: var(--muted);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Skeleton ── */
    @keyframes shimmer {
      0%   { background-position: -800px 0; }
      100% { background-position:  800px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 4px;
    }
    .skeleton-section { margin-bottom: 40px; }
    .sk-header { height: 16px; width: 160px; margin-bottom: 18px; border-radius: 6px; }
    .sk-row-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }
    .sk-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .sk-thumb { height: 80px; border-radius: 6px; margin-bottom: 12px; }
    .sk-t1 { height: 11px; margin-bottom: 6px; }
    .sk-t2 { height: 11px; width: 70%; margin-bottom: 12px; }
    .sk-bottom { display: flex; justify-content: space-between; }
    .sk-price { height: 13px; width: 38%; }
    .sk-stars { height: 13px; width: 28%; }

    /* ── Loading bar ── */
    #load-bar {
      position: fixed; top: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, #60a5fa, var(--brand), #60a5fa);
      background-size: 300% 100%;
      animation: bar-move 1s ease infinite;
      z-index: 999;
      transition: width .3s, opacity .4s;
    }
    @keyframes bar-move {
      0%   { background-position: 100% 0; }
      100% { background-position:   0% 0; }
    }

    /* ── Chat panel ── */
    .chat-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-top: 8px;
    }
    .chat-panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .chat-panel-header h2 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }
    .ai-badge {
      background: var(--brand);
      color: #fff;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 2px 7px;
    }
    .chat-row { display: flex; gap: 10px; }
    #chat-input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: .88rem;
      font-family: inherit;
      outline: none;
      resize: none;
      height: 44px;
      transition: border-color .15s;
      color: var(--text);
      background: var(--bg);
    }
    #chat-input:focus { border-color: var(--brand); background: var(--surface); }
    #send-btn {
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 22px;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .1s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: var(--brand-dark); transform: translateY(-1px); }
    #send-btn:disabled { opacity: .45; cursor: not-allowed; }

    #chat-status {
      margin-top: 10px;
      font-size: .78rem;
      color: var(--muted);
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spinner {
      width: 13px; height: 13px;
      border: 2px solid #cbd5e1;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Rec results ── */
    #results { margin-top: 24px; }
    .results-label {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 720px) { .rec-grid { grid-template-columns: 1fr; } }

    .rec-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px 16px;
      background: var(--surface);
      position: relative;
      transition: box-shadow .18s;
    }
    .rec-card:hover { box-shadow: var(--shadow-md); }
    .rec-rank-badge {
      position: absolute;
      top: -11px; left: 14px;
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem;
      font-weight: 800;
      color: #fff;
    }
    .rank-1 { background: #f59e0b; }
    .rank-2 { background: #94a3b8; }
    .rank-3 { background: #b45309; }
    .rec-thumb {
      width: 100%; height: 100px;
      border-radius: 6px;
      overflow: hidden;
      margin: 4px 0 12px;
      background: var(--bg);
    }
    .rec-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .rec-title { font-size: .88rem; font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
    .rec-meta { display: flex; gap: 12px; margin-bottom: 8px; font-size: .82rem; }
    .rec-price { color: var(--brand); font-weight: 700; }
    .rec-rating { color: var(--accent); font-weight: 600; }
    .rec-cat-pill {
      display: inline-block;
      background: var(--brand-light);
      color: var(--brand);
      font-size: .68rem;
      font-weight: 600;
      border-radius: 20px;
      padding: 2px 9px;
      margin-bottom: 10px;
    }
    .rec-explanation {
      font-size: .78rem;
      color: #475569;
      line-height: 1.55;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    /* ── Results panel (between search and catalog) ── */
    .results-panel {
      background: var(--surface);
      border: 1px solid #bfdbfe;
      border-radius: 14px;
      padding: 20px 24px 24px;
      margin-top: 16px;
      box-shadow: 0 0 0 4px rgba(29,78,216,.05);
    }

    /* ── Divider ── */
    .section-divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }
  </style>
</head>
<body>

<div id="load-bar" style="width:20%"></div>

<!-- Nav -->
<nav>
  <div class="nav-left">
    <div class="nav-logo">ShopBot</div>
    <span class="nav-tagline">Agentic Recommendations</span>
  </div>
  <div class="nav-right" id="login-area">
    <span class="login-label" id="login-label">Loading…</span>
  </div>
</nav>

<!-- Page -->
<div class="page">

  <!-- Login notice -->
  <div id="login-gate">
    <span>👆</span>
    Log in as one of the test users above, then click products you like to personalise recommendations.
  </div>

  <!-- Search bar — always on top -->
  <div class="chat-panel">
    <div class="chat-panel-header">
      <h2>Ask the Agent</h2>
      <span class="ai-badge">AI</span>
    </div>
    <div class="chat-row">
      <textarea id="chat-input" placeholder="e.g. recommend me something for travel…" rows="1"></textarea>
      <button id="send-btn" disabled>Ask</button>
    </div>
    <div id="chat-status"></div>
  </div>

  <!-- Recommendations inject here, between search and catalog -->
  <div id="results"></div>

  <hr class="section-divider" />

  <!-- Catalog -->
  <div id="catalog"></div>
  <div id="clicks-counter"></div>

</div>

<script>
// ── State ─────────────────────────────────────────────────
let currentUser  = null;
let clickedItems = new Set();

// ── Category image seeds (picsum.photos/seed/<seed>) ─────
const CAT_SEEDS = {
  "toys":        "toy",
  "electronics": "electronics",
  "sports":      "sports",
  "books":       "library",
  "clothing":    "fashion",
  "home":        "kitchen",
  "beauty":      "cosmetics",
  "automotive":  "car",
  "pet":         "puppy",
  "health":      "pharmacy",
  "grocery":     "fruit",
  "musical":     "guitar",
  "office":      "desk",
  "video":       "gaming",
  "movies":      "cinema",
  "tools":       "workshop",
  "garden":      "garden",
  "baby":        "baby",
  "industrial":  "factory",
  "software":    "computer",
};

function catSeed(cat) {
  const lower = cat.toLowerCase();
  for (const [key, seed] of Object.entries(CAT_SEEDS)) {
    if (lower.includes(key)) return seed;
  }
  return "shopping";
}

function catImageUrl(cat, w, h) {
  return `https://picsum.photos/seed/${catSeed(cat)}/${w}/${h}`;
}

// Product image: use item_id as seed for variety within a category
function productImageUrl(itemId, w, h) {
  return `https://picsum.photos/seed/${itemId}/${w}/${h}`;
}

// ── Helpers ───────────────────────────────────────────────
function esc(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function stars(r) {
  const full = Math.round(Number(r));
  return "★".repeat(Math.max(0,full)) + "☆".repeat(Math.max(0,5-full));
}
function fmt(n) { return Number(n) > 0 ? "$" + Number(n).toFixed(2) : "—"; }

// ── Loading bar ───────────────────────────────────────────
const loadBar = document.getElementById("load-bar");
function setProgress(p) { loadBar.style.width = p + "%"; }
function hideBar() {
  loadBar.style.width = "100%";
  setTimeout(() => { loadBar.style.opacity = "0"; }, 200);
  setTimeout(() => { loadBar.style.display = "none"; }, 600);
}

// ── Skeleton ──────────────────────────────────────────────
function showSkeletons() {
  const catalog = document.getElementById("catalog");
  catalog.innerHTML = [1,2].map(() => `
    <div class="skeleton-section">
      <div class="skeleton sk-header"></div>
      <div class="sk-row-grid">
        ${Array.from({length:5}, () => `
          <div class="sk-card">
            <div class="skeleton sk-thumb"></div>
            <div class="skeleton sk-t1"></div>
            <div class="skeleton sk-t2"></div>
            <div class="sk-bottom">
              <div class="skeleton sk-price"></div>
              <div class="skeleton sk-stars"></div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>
  `).join("");
}

// ── Boot ──────────────────────────────────────────────────
async function boot() {
  showSkeletons();
  setProgress(25);

  const [products, users] = await Promise.all([
    fetch("/api/products").then(r => r.json()),
    fetch("/api/users").then(r => r.json()),
  ]);

  setProgress(80);
  renderUsers(users);
  setProgress(95);
  renderCatalog(products);
  hideBar();
}

// ── Render users ──────────────────────────────────────────
function renderUsers(users) {
  const area  = document.getElementById("login-area");
  const label = document.getElementById("login-label");
  label.textContent = "Log in as:";
  users.forEach(u => {
    const btn = document.createElement("button");
    btn.className = "btn-user";
    btn.textContent = u.name.split(" ")[0];
    btn.title = `Log in as ${u.name}`;
    btn.dataset.userId = u.user_id;
    btn.onclick = () => loginAs(u, btn);
    area.appendChild(btn);
  });
}

function loginAs(user, btn) {
  currentUser = user;
  clickedItems.clear();

  document.querySelectorAll(".btn-user").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  let badge = document.getElementById("logged-badge");
  if (!badge) {
    badge = document.createElement("span");
    badge.id = "logged-badge";
    badge.className = "logged-in-badge";
    document.getElementById("login-area").appendChild(badge);
  }
  badge.textContent = `✓ ${user.name}`;

  document.getElementById("login-gate").classList.add("hidden");
  document.getElementById("send-btn").disabled = false;
  document.querySelectorAll(".product-card").forEach(c => c.classList.remove("clicked"));
  updateCounter();
}

// ── Render catalog grouped by category ───────────────────
function renderCatalog(products) {
  const byCategory = {};
  products.forEach(p => {
    if (!byCategory[p.category]) byCategory[p.category] = [];
    byCategory[p.category].push(p);
  });

  const catalog = document.getElementById("catalog");
  catalog.innerHTML = "";

  Object.entries(byCategory).forEach(([cat, items]) => {
    const section = document.createElement("div");
    section.className = "category-section";
    section.innerHTML = `
      <div class="category-header">
        <div class="category-icon">
          <img src="${catImageUrl(cat, 80, 80)}" alt="${esc(cat)}" loading="lazy" />
        </div>
        <span class="category-name">${esc(cat)}</span>
        <span class="category-count">${items.length} item${items.length !== 1 ? "s" : ""}</span>
      </div>
      <div class="product-row" id="row-${CSS.escape(cat)}"></div>
    `;

    const row = section.querySelector(".product-row");
    items.forEach(p => {
      const card = document.createElement("div");
      card.className = "product-card";
      card.dataset.itemId = p.item_id;
      card.innerHTML = `
        <div class="card-thumb">
          <img src="${productImageUrl(p.item_id, 240, 110)}" alt="${esc(p.title)}" loading="lazy" />
        </div>
        <div class="card-title">${esc(p.title)}</div>
        ${p.brand ? `<div class="card-brand">${esc(p.brand)}</div>` : ""}
        <div class="card-footer">
          <span class="card-price">${fmt(p.price_usd)}</span>
          <span class="card-rating">${stars(p.avg_rating)} ${Number(p.avg_rating).toFixed(1)}</span>
        </div>
      `;
      card.addEventListener("click", () => handleClick(card, p));
      row.appendChild(card);
    });

    catalog.appendChild(section);
  });
}

// ── Click handler ─────────────────────────────────────────
async function handleClick(card, product) {
  if (!currentUser) {
    document.getElementById("login-gate").scrollIntoView({ behavior: "smooth" });
    return;
  }
  if (clickedItems.has(product.item_id)) return;
  clickedItems.add(product.item_id);
  card.classList.add("clicked");
  updateCounter();
  fetch("/api/click", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: currentUser.user_id, item_id: product.item_id }),
  });
}

function updateCounter() {
  const el = document.getElementById("clicks-counter");
  if (!currentUser) { el.textContent = ""; return; }
  const n = clickedItems.size;
  el.textContent = n === 0
    ? `Logged in as ${currentUser.name} — click products to personalise recommendations`
    : `${currentUser.name} · ${n} product${n > 1 ? "s" : ""} selected`;
}

// ── Chat ──────────────────────────────────────────────────
document.getElementById("send-btn").addEventListener("click", sendQuery);
document.getElementById("chat-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuery(); }
});

async function sendQuery() {
  const input   = document.getElementById("chat-input");
  const query   = input.value.trim();
  const status  = document.getElementById("chat-status");
  const results = document.getElementById("results");
  if (!query || !currentUser) return;

  document.getElementById("send-btn").disabled = true;
  status.innerHTML = `<span class="spinner"></span> Agent is searching…`;
  results.innerHTML = "";

  try {
    const res  = await fetch("/api/recommend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: currentUser.user_id, query }),
    });
    const data = await res.json();
    if (data.error) {
      status.innerHTML = `<span style="color:#ef4444">⚠ ${esc(data.error)}</span>`;
      return;
    }
    status.innerHTML = `<span style="color:#16a34a">✓ ${data.recommendations.length} recommendations for <strong>${esc(currentUser.name)}</strong></span>`;
    renderRecs(data.recommendations);
  } catch (err) {
    status.innerHTML = `<span style="color:#ef4444">⚠ Network error: ${esc(String(err))}</span>`;
  } finally {
    document.getElementById("send-btn").disabled = false;
  }
}

// ── Render recommendations ────────────────────────────────
function renderRecs(recs) {
  const container = document.getElementById("results");
  container.innerHTML = `
    <div class="results-panel">
      <div class="results-label">Top picks for you</div>
      <div class="rec-grid" id="rec-grid"></div>
    </div>
  `;
  const grid = document.getElementById("rec-grid");

  recs.forEach((r, i) => {
    const card = document.createElement("div");
    card.className = "rec-card";
    card.innerHTML = `
      <div class="rec-rank-badge rank-${r.rank}">${r.rank}</div>
      <div class="rec-thumb">
        <img src="${productImageUrl(r.item_id, 320, 100)}" alt="${esc(r.title)}" loading="lazy" />
      </div>
      <div class="rec-title">${esc(r.title)}</div>
      <div class="rec-meta">
        <span class="rec-price">${fmt(r.price)}</span>
        <span class="rec-rating">★ ${Number(r.rating).toFixed(1)}</span>
      </div>
      <span class="rec-cat-pill">${esc(r.category)}</span>
      <div class="rec-explanation">${esc(r.explanation)}</div>
    `;
    grid.appendChild(card);
  });

  container.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// ── Go ────────────────────────────────────────────────────
boot();
</script>
