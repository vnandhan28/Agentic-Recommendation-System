<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopBot — Agentic Recommendations</title>
  <style>
    /* ── Reset & base ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      color: #1a1a2e;
      min-height: 100vh;
    }

    /* ── Top nav ──────────────────────────────────────── */
    nav {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(79,70,229,.35);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .nav-logo span { opacity: .75; font-weight: 400; font-size: .9rem; margin-left: 6px; }
    .login-area {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-label { color: rgba(255,255,255,.7); font-size: .8rem; }
    .btn-user {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: .82rem;
      cursor: pointer;
      transition: background .15s, transform .1s;
    }
    .btn-user:hover { background: rgba(255,255,255,.28); transform: translateY(-1px); }
    .btn-user.active {
      background: #fff;
      color: #4f46e5;
      font-weight: 600;
      border-color: #fff;
    }
    .logged-in-badge {
      color: #a5f3fc;
      font-size: .82rem;
      font-weight: 500;
    }

    /* ── Page wrapper ─────────────────────────────────── */
    .page { max-width: 1120px; margin: 0 auto; padding: 24px 16px 120px; }

    /* ── Section heading ──────────────────────────────── */
    .section-title {
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #6b7280;
      margin-bottom: 14px;
    }

    /* ── Product grid ─────────────────────────────────── */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px;
      margin-bottom: 32px;
    }
    .product-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 14px 14px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color .18s, box-shadow .18s, transform .12s;
      position: relative;
      user-select: none;
    }
    .product-card:hover {
      box-shadow: 0 4px 16px rgba(79,70,229,.15);
      transform: translateY(-2px);
    }
    .product-card.clicked {
      border-color: #4f46e5;
      background: #fafaff;
    }
    .product-card.clicked::after {
      content: "✓";
      position: absolute;
      top: 8px;
      right: 10px;
      color: #4f46e5;
      font-weight: 700;
      font-size: .85rem;
    }
    .card-icon {
      font-size: 2rem;
      margin-bottom: 10px;
      display: block;
      text-align: center;
    }
    .card-title {
      font-size: .82rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 8px;
      min-height: 2.2em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .card-price {
      font-size: .9rem;
      font-weight: 700;
      color: #4f46e5;
    }
    .card-rating {
      font-size: .78rem;
      color: #f59e0b;
      font-weight: 500;
    }
    .card-category {
      font-size: .7rem;
      color: #6b7280;
      background: #f3f4f6;
      border-radius: 10px;
      padding: 2px 8px;
      display: inline-block;
    }
    .click-hint {
      font-size: .68rem;
      color: #9ca3af;
      text-align: center;
      margin-bottom: 18px;
    }

    /* ── Chat box ─────────────────────────────────────── */
    .chat-section {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    .chat-section-title {
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #1a1a2e;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chat-section-title .badge {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border-radius: 6px;
      padding: 2px 8px;
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .04em;
    }
    .chat-row {
      display: flex;
      gap: 10px;
    }
    #chat-input {
      flex: 1;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
      resize: none;
      height: 44px;
    }
    #chat-input:focus { border-color: #4f46e5; }
    #send-btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
    #send-btn:disabled { opacity: .5; cursor: not-allowed; }
    #chat-status {
      margin-top: 10px;
      font-size: .8rem;
      color: #6b7280;
      min-height: 20px;
    }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid #d1d5db;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Recommendation results ───────────────────────── */
    #results { margin-top: 24px; }
    .results-heading {
      font-size: .85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 14px;
    }
    .rec-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    @media (max-width: 700px) { .rec-grid { grid-template-columns: 1fr; } }
    .rec-card {
      border-radius: 12px;
      padding: 18px 16px;
      position: relative;
      border: 1.5px solid #e5e7eb;
      background: #fff;
      transition: box-shadow .18s;
    }
    .rec-card:hover { box-shadow: 0 4px 20px rgba(79,70,229,.12); }
    .rec-rank {
      position: absolute;
      top: -10px; left: 14px;
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .8rem;
      font-weight: 700;
      color: #fff;
    }
    .rank-1 { background: #f59e0b; }
    .rank-2 { background: #9ca3af; }
    .rank-3 { background: #cd7c2f; }
    .rec-icon { font-size: 1.6rem; display: block; text-align: center; margin: 8px 0 10px; }
    .rec-title { font-size: .9rem; font-weight: 700; margin-bottom: 6px; }
    .rec-meta {
      display: flex; gap: 10px; margin-bottom: 10px;
      font-size: .82rem;
    }
    .rec-price { color: #4f46e5; font-weight: 700; }
    .rec-rating { color: #f59e0b; font-weight: 500; }
    .rec-category-badge {
      font-size: .7rem; background: #ede9fe; color: #4f46e5;
      border-radius: 10px; padding: 2px 8px; display: inline-block;
      margin-bottom: 10px;
    }
    .rec-explanation {
      font-size: .8rem;
      color: #4b5563;
      line-height: 1.55;
      border-top: 1px solid #f3f4f6;
      padding-top: 10px;
      margin-top: 4px;
    }

    /* ── Skeleton loading ────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #e5e7eb 25%, #f3f4f6 50%, #e5e7eb 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 6px;
    }
    .skeleton-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 14px 14px;
      border: 2px solid transparent;
    }
    .sk-icon  { width: 40px; height: 40px; border-radius: 50%; margin: 0 auto 10px; }
    .sk-title { height: 12px; margin-bottom: 6px; }
    .sk-title2{ height: 12px; width: 65%; margin-bottom: 10px; }
    .sk-row   { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .sk-price { height: 14px; width: 40%; }
    .sk-stars { height: 14px; width: 30%; }
    .sk-badge { height: 20px; width: 50%; border-radius: 10px; }

    /* ── Top loading bar ─────────────────────────────────── */
    #load-bar {
      position: fixed;
      top: 0; left: 0;
      height: 3px;
      background: linear-gradient(90deg, #a5b4fc, #7c3aed, #a5b4fc);
      background-size: 300% 100%;
      animation: bar-slide 1.2s ease-in-out infinite;
      z-index: 200;
      transition: width .3s ease, opacity .4s ease;
    }
    @keyframes bar-slide {
      0%   { background-position: 100% 0; }
      100% { background-position:   0% 0; }
    }

    /* ── Login gate overlay ───────────────────────────────── */
    #login-gate {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: .85rem;
      color: #856404;
      margin-bottom: 18px;
    }
    #login-gate.hidden { display: none; }
    #clicks-counter {
      font-size: .78rem;
      color: #6b7280;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<!-- ── Top loading bar ───────────────────────────────── -->
<div id="load-bar" style="width:30%"></div>

<!-- ── Nav ───────────────────────────────────────────── -->
<nav>
  <div class="nav-logo">ShopBot <span>🛍️</span></div>
  <div class="login-area" id="login-area">
    <span class="login-label" id="login-label">Loading…</span>
    <!-- user buttons populated by JS -->
  </div>
</nav>

<!-- ── Page ──────────────────────────────────────────── -->
<div class="page">

  <!-- Login warning -->
  <div id="login-gate">
    👆 Log in as one of the test users above, then click some products you like.
  </div>

  <!-- Product grid -->
  <div class="section-title">Catalog — 20 products</div>
  <div class="click-hint" id="click-hint">Click products to register your interest (works after logging in)</div>
  <div class="product-grid" id="product-grid">
    <!-- 20 skeleton cards shown immediately while API loads -->
  </div>

  <div id="clicks-counter"></div>

  <!-- Chat -->
  <div class="chat-section">
    <div class="chat-section-title">
      Ask the agent
      <span class="badge">AI</span>
    </div>
    <div class="chat-row">
      <textarea id="chat-input" placeholder="e.g. recommend me something for travel…" rows="1"></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
    <div id="chat-status"></div>
    <div id="results"></div>
  </div>

</div>

<script>
// ── State ────────────────────────────────────────────────
let currentUser  = null;   // { user_id, name }
let clickedItems = new Set();
let allProducts  = [];

// ── Category emoji map ───────────────────────────────────
const CAT_EMOJI = {
  "Toys & Games":      "🎲",
  "Electronics":       "🔌",
  "Sports & Outdoors": "🏕️",
  "Books":             "📚",
};
function catEmoji(cat) { return CAT_EMOJI[cat] || "🛍️"; }

// ── Helpers ──────────────────────────────────────────────
function stars(r) { return "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r)); }
function esc(s)   { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

// ── Progress bar helpers ──────────────────────────────────
const loadBar = document.getElementById("load-bar");
function setProgress(pct) { loadBar.style.width = pct + "%"; }
function hideBar() {
  loadBar.style.width = "100%";
  setTimeout(() => { loadBar.style.opacity = "0"; }, 200);
  setTimeout(() => { loadBar.style.display = "none"; }, 600);
}

// ── Skeleton grid ─────────────────────────────────────────
function showSkeletons(n = 20) {
  const grid = document.getElementById("product-grid");
  grid.innerHTML = Array.from({length: n}, () => `
    <div class="skeleton-card">
      <div class="skeleton sk-icon"></div>
      <div class="skeleton sk-title"></div>
      <div class="skeleton sk-title2"></div>
      <div class="sk-row">
        <div class="skeleton sk-price"></div>
        <div class="skeleton sk-stars"></div>
      </div>
      <div class="skeleton sk-badge"></div>
    </div>
  `).join("");
}

// ── Boot ─────────────────────────────────────────────────
async function boot() {
  showSkeletons();           // grid fills instantly with placeholders
  setProgress(30);

  const [products, users] = await Promise.all([
    fetch("/api/products").then(r => r.json()),
    fetch("/api/users").then(r => r.json()),
  ]);

  setProgress(80);
  allProducts = products;

  document.getElementById("login-label").textContent = "Log in as:";
  renderUsers(users);

  setProgress(95);
  renderProducts(products);  // replaces skeletons with real cards
  hideBar();
}

// ── Render user login buttons ─────────────────────────────
function renderUsers(users) {
  const area = document.getElementById("login-area");
  // Remove the static "Log in as:" span — it stays in place via login-label id
  users.forEach(u => {
    const btn = document.createElement("button");
    btn.className  = "btn-user";
    btn.textContent = u.name.split(" ")[0];   // first name only
    btn.title       = `Log in as ${u.name}`;
    btn.dataset.userId = u.user_id;
    btn.dataset.name   = u.name;
    btn.onclick = () => loginAs(u, btn);
    area.appendChild(btn);
  });
}

function loginAs(user, btn) {
  currentUser = user;
  clickedItems.clear();

  // Update button styles
  document.querySelectorAll(".btn-user").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  // Show badge
  let badge = document.getElementById("logged-badge");
  if (!badge) {
    badge = document.createElement("span");
    badge.id = "logged-badge";
    badge.className = "logged-in-badge";
    document.getElementById("login-area").appendChild(badge);
  }
  badge.textContent = `✓ ${user.name}`;

  // Hide warning, enable chat
  document.getElementById("login-gate").classList.add("hidden");
  document.getElementById("send-btn").disabled = false;

  // Reset product cards
  document.querySelectorAll(".product-card").forEach(c => c.classList.remove("clicked"));
  updateClicksCounter();
}

// ── Render product grid ───────────────────────────────────
function renderProducts(products) {
  const grid = document.getElementById("product-grid");
  grid.innerHTML = "";
  products.forEach(p => {
    const card = document.createElement("div");
    card.className = "product-card";
    card.dataset.itemId = p.item_id;
    card.innerHTML = `
      <span class="card-icon">${catEmoji(p.category)}</span>
      <div class="card-title">${esc(p.title)}</div>
      <div class="card-meta">
        <span class="card-price">$${Number(p.price_usd).toFixed(2)}</span>
        <span class="card-rating">${stars(p.avg_rating)} ${Number(p.avg_rating).toFixed(1)}</span>
      </div>
      <span class="card-category">${esc(p.category)}</span>
    `;
    card.addEventListener("click", () => handleProductClick(card, p));
    grid.appendChild(card);
  });
}

async function handleProductClick(card, product) {
  if (!currentUser) {
    document.getElementById("login-gate").scrollIntoView({ behavior: "smooth" });
    document.getElementById("login-gate").style.animation = "none";
    return;
  }
  if (clickedItems.has(product.item_id)) return; // already clicked

  clickedItems.add(product.item_id);
  card.classList.add("clicked");
  updateClicksCounter();

  // Fire-and-forget to backend
  await fetch("/api/click", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: currentUser.user_id, item_id: product.item_id }),
  });
}

function updateClicksCounter() {
  const el = document.getElementById("clicks-counter");
  if (!currentUser) { el.textContent = ""; return; }
  const n = clickedItems.size;
  el.textContent = n === 0
    ? `Logged in as ${currentUser.name} — click some products to personalise recommendations`
    : `${currentUser.name} · ${n} product${n>1?"s":""} clicked`;
}

// ── Chat send ─────────────────────────────────────────────
document.getElementById("send-btn").addEventListener("click", sendQuery);
document.getElementById("chat-input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendQuery(); }
});

async function sendQuery() {
  const input  = document.getElementById("chat-input");
  const query  = input.value.trim();
  const status = document.getElementById("chat-status");
  const results = document.getElementById("results");

  if (!query || !currentUser) return;

  // Disable UI
  document.getElementById("send-btn").disabled = true;
  status.innerHTML = `<span class="spinner"></span>Agent is searching…`;
  results.innerHTML = "";

  try {
    const res = await fetch("/api/recommend", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: currentUser.user_id, query }),
    });
    const data = await res.json();

    if (data.error) {
      status.innerHTML = `<span style="color:#ef4444">⚠ ${esc(data.error)}</span>`;
      return;
    }

    status.innerHTML = `<span style="color:#10b981">✓ Agent returned ${data.recommendations.length} recommendations for <b>${esc(currentUser.name)}</b></span>`;
    renderRecommendations(data.recommendations);

  } catch (err) {
    status.innerHTML = `<span style="color:#ef4444">⚠ Network error: ${esc(String(err))}</span>`;
  } finally {
    document.getElementById("send-btn").disabled = false;
  }
}

// ── Render recommendation cards ───────────────────────────
function renderRecommendations(recs) {
  const container = document.getElementById("results");
  const rankLabel = ["🥇","🥈","🥉"];

  container.innerHTML = `
    <div class="results-heading">Top picks for you</div>
    <div class="rec-grid" id="rec-grid"></div>
  `;
  const grid = document.getElementById("rec-grid");

  recs.forEach((r, i) => {
    const card = document.createElement("div");
    card.className = "rec-card";
    card.innerHTML = `
      <div class="rec-rank rank-${r.rank}">${r.rank}</div>
      <span class="rec-icon">${rankLabel[i] || "🎁"}</span>
      <div class="rec-title">${esc(r.title)}</div>
      <div class="rec-meta">
        <span class="rec-price">$${Number(r.price).toFixed(2)}</span>
        <span class="rec-rating">★ ${Number(r.rating).toFixed(1)}</span>
      </div>
      <span class="rec-category-badge">${esc(r.category)}</span>
      <div class="rec-explanation">${esc(r.explanation)}</div>
    `;
    grid.appendChild(card);
  });

  container.scrollIntoView({ behavior: "smooth", block: "start" });
}

// ── Go ────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
